# hyprlock — screen locker. Real config; the default path
# ~/.config/hypr/hyprlock.conf is a stub that sources this.

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

# Blurred snapshot of the screen as the background.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.17
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(cdd6f4)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgb(a6adc8)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(89b4fa)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">  Locked — enter password</span>
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>
    rounding = 12
    position = 0, -20
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = cmd[] echo "Hi, $(whoami)"
    color = rgb(89b4fa)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = bottom
}
