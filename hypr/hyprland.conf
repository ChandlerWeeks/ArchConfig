# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

autogenerated = 0

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = wofi

source = ~/.config/sysconfig/hypr/input.conf
source = ~/.config/sysconfig/monitors/monitors.conf

workspace = 1, monitor:DP-2, default:true, persistent:true
workspace = 2, monitor:DP-2, persistent:true
workspace = 3, monitor:DP-2, persistent:true
workspace = 4, monitor:DP-2, persistent:true
workspace = 5, monitor:DP-3, default:true, persistent:true
workspace = 6, monitor:DP-3, persistent:true
workspace = 7, monitor:DP-3, persistent:true
workspace = 8, monitor:DP-3, persistent:true
workspace = 9, monitor:DP-3, persistent:true

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    sensitivity = 0
    accel_profile = flat
}

exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = dunst
exec-once = hyprpaper --config ~/.config/sysconfig/hyprpaper/hyprpaper.conf
