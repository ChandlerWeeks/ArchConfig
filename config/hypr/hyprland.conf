# Catppuccin Mocha desktop. Hardware overrides live in local.conf.
autogenerated = 0

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun

# Application integration and the original Adwaita cursor.
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

# Catppuccin Mocha, mauve accent.
general {
    col.active_border = rgba(cba6f7ff)
    col.inactive_border = rgba(45475aff)
    border_size = 2
    gaps_in = 3
    gaps_out = 18
}

decoration {
    rounding = 8
}

source = ~/.config/hypr/input.conf
# Selected by install.py; intentionally kept separate from shared settings.
source = ~/.config/hypr/local.conf

# Keep directional window focus inside the current workspace.
binds {
    window_direction_monitor_fallback = false
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    # Both physical Alt keys become Ctrl; physical Ctrl keys become Alt.
    kb_options = ctrl:swap_lalt_lctl,ctrl:swap_ralt_rctl
    sensitivity = 0
    accel_profile = flat
}

# Import the Wayland environment before starting user services.
exec-once = ~/.local/bin/desktop-startup
exec-once = hypridle -c ~/.config/hypr/hypridle.conf
exec-once = hyprpaper --config ~/.config/hyprpaper/hyprpaper.conf
