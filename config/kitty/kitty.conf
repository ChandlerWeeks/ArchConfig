# vim:fileencoding=utf-8

# ── Typeface and spacing ──────────────────────────────────────────────
# Match the Nerd Font used elsewhere in the desktop, while keeping the
# monospaced variant that is best suited to terminal output.
font_family family="JetBrainsMono Nerd Font Mono"
font_size 12.0
disable_ligatures cursor

window_padding_width 8
placement_strategy center
hide_window_decorations yes

# ── Catppuccin Mocha (mauve accent) ──────────────────────────────────
# Matches the KDE color scheme and the rest of the dark desktop palette.
foreground              #cdd6f4
background              #1e1e2e
# Let the wallpaper show through while keeping terminal text solid.
background_opacity      0.82
dynamic_background_opacity yes

selection_foreground    #1e1e2e
selection_background    #cba6f7

cursor                   #f5e0dc
cursor_text_color        #1e1e2e
url_color                #89b4fa
url_style                curly

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# A quiet visual bell is more useful on a desktop than an audio beep.
enable_audio_bell no
visual_bell_duration 0.12
visual_bell_color #cba6f7

# Keep enough history for long build logs without being excessive.
scrollback_lines 10000

# ── Tabs ──────────────────────────────────────────────────────────────
# Keep tab controls visible even with one tab; the + button is clickable.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_align left
tab_bar_min_tabs 1
tab_bar_show_new_tab_button yes
tab_bar_margin_width 8
tab_bar_margin_height 6 0
tab_bar_background #181825
tab_bar_margin_color #1e1e2e

tab_title_template " {index}: {title} "
tab_title_max_length 30
active_tab_foreground #1e1e2e
active_tab_background #cba6f7
active_tab_font_style bold
inactive_tab_foreground #a6adc8
inactive_tab_background #313244
inactive_tab_font_style normal
tab_switch_strategy previous

# ── Tab keybindings ──────────────────────────────────────────────────
# Creation and closing. New tabs start in the active tab's directory.
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab

# Familiar browser/desktop navigation and reordering.
map ctrl+page_up previous_tab
map ctrl+page_down next_tab
map ctrl+shift+page_up move_tab_backward
map ctrl+shift+page_down move_tab_forward

# Keep the existing arrow navigation aliases.
map ctrl+alt+left previous_tab
map ctrl+alt+right next_tab

# Jump directly to a numbered tab (the number is shown in the tab title).
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9

# Give a long-running tab a useful name without leaving the keyboard.
map ctrl+alt+r set_tab_title

# Physical Alt is Ctrl after the desktop-wide Ctrl/Alt swap.
# Use the key labeled Alt for tab navigation: h/k previous, j/l next.
map ctrl+left previous_tab
map ctrl+right next_tab
map ctrl+h previous_tab
map ctrl+k previous_tab
map ctrl+j next_tab
map ctrl+l next_tab

# Keep the familiar physical Alt+T / Alt+W tab shortcuts after the swap.
map ctrl+t new_tab_with_cwd
map ctrl+w close_tab
